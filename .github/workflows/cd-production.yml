name: Production CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Monorepo Apps & Packages
        run: npx turbo run build

      - name: Deploy Services
        run: |
          echo "🚀 Simulating Deployment to Production Cluster..."
          echo "✅ Successfully deployed all services."
